name: APK Smash Kheys

# Construit l'APK :
#  - à chaque tag "vX.Y.Z" poussé  → APK publiée dans une Release GitHub (c'est elle que les kheys téléchargent)
#  - à la main (onglet Actions → "APK Smash Kheys" → Run workflow) → APK téléchargeable dans les artefacts du build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${GITHUB_RUN_NUMBER}-test"; fi
          echo "SSK_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "SSK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          KS: ${{ secrets.SSK_KEYSTORE_B64 }}
          PW: ${{ secrets.SSK_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Il manque les secrets SSK_KEYSTORE_B64 et/ou SSK_KEYSTORE_PASS (Settings → Secrets and variables → Actions). Voir le README."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ssk.jks"
          echo "SSK_KEYSTORE_FILE=$RUNNER_TEMP/ssk.jks" >> "$GITHUB_ENV"
          echo "SSK_KEYSTORE_PASS=$PW" >> "$GITHUB_ENV"

      - name: Construction
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renommage
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SmashKheys-${SSK_VERSION_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SmashKheys-${{ env.SSK_VERSION_NAME }}
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Super Smash Kheys ${{ env.SSK_VERSION_NAME }}
          body: |
            Télécharge **SmashKheys-${{ env.SSK_VERSION_NAME }}.apk** ci-dessous et ouvre-le sur ton téléphone Android.
            Si Android le demande, autorise l'installation depuis ton navigateur / ton gestionnaire de fichiers.
            Mise à jour : installe simplement la nouvelle APK par-dessus l'ancienne, ta progression est gardée.
