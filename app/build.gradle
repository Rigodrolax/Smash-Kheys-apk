plugins {
    id 'com.android.application'
}

// Version de l'appli : donnée par GitHub Actions (tag vX.Y.Z et numéro de build), sinon valeurs par défaut
def appVersionCode = (System.getenv('SSK_VERSION_CODE') ?: '1') as int
def appVersionName = System.getenv('SSK_VERSION_NAME') ?: '0.99.1'

android {
    namespace 'fr.kheys.smash'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.kheys.smash'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    // Signature : la clé est donnée par GitHub Actions (secrets SSK_KEYSTORE_B64 et SSK_KEYSTORE_PASS).
    // Toujours la même clé, sinon Android refuse d'installer la mise à jour par-dessus l'ancienne appli.
    signingConfigs {
        release {
            def ks = System.getenv('SSK_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SSK_KEYSTORE_PASS')
                keyAlias 'smashkheys'
                keyPassword System.getenv('SSK_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SSK_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
