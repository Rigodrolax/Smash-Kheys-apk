name: APK Smash Kheys

# Construit l'APK à chaque modification de la branche main.
#  - Si la version écrite dans version.txt n'a pas encore de Release → APK signée publiée dans une Release "vX.Y.Z"
#    (c'est elle que les kheys téléchargent). Pour publier une nouvelle version : changer version.txt.
#  - Sinon → simple build de test (APK dans les artefacts du build).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/**', '.github/workflows/**', '*.gradle', 'version.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true; fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < version.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; PUB=1
          elif gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then PUB=0; V="$V-test${GITHUB_RUN_NUMBER}"
          else PUB=1; fi
          echo "SSK_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "SSK_PUBLISH=$PUB" >> "$GITHUB_ENV"
          echo "SSK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Version $V (publication : $PUB)"

      - name: Clé de signature
        env:
          KS: ${{ secrets.SSK_KEYSTORE_B64 }}
          PW: ${{ secrets.SSK_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            if [ "$SSK_PUBLISH" = "1" ]; then
              echo "::error::Il manque les secrets SSK_KEYSTORE_B64 et/ou SSK_KEYSTORE_PASS (Settings → Secrets and variables → Actions). Voir le README."
              exit 1
            fi
            echo "::warning::Secrets de signature absents : APK de test signée avec une clé de débogage (ne pas la distribuer)."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ssk.jks"
          echo "SSK_KEYSTORE_FILE=$RUNNER_TEMP/ssk.jks" >> "$GITHUB_ENV"
          echo "SSK_KEYSTORE_PASS=$PW" >> "$GITHUB_ENV"

      - name: Construction
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Erreurs de construction
        if: failure()
        run: |
          grep -E "error:|FAILURE|What went wrong|Could not|\.java:[0-9]+|> " build.log | head -40 > err.txt || true
          echo "::error title=Gradle::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt)"

      - name: Renommage
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SmashKheys-${SSK_VERSION_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SmashKheys-${{ env.SSK_VERSION_NAME }}
          path: dist/*.apk

      - name: Release
        if: env.SSK_PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SSK_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          name: Super Smash Kheys ${{ env.SSK_VERSION_NAME }}
          body: |
            Télécharge **SmashKheys-${{ env.SSK_VERSION_NAME }}.apk** ci-dessous et ouvre-le sur ton téléphone Android.
            Si Android le demande, autorise l'installation depuis ton navigateur / ton gestionnaire de fichiers.
            Mise à jour : installe simplement la nouvelle APK par-dessus l'ancienne, ta progression est gardée.
